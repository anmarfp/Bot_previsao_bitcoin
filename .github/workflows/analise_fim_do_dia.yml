name: Fim do Dia - Avaliação
on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC (do dia seguinte) = 22:00 BRT
jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install google-genai requests
      - run: python robot_bitcoin.py noite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salvar Histórico
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "bot@noreply.com"
          git add historico_bitcoin.json
          git commit -m "Auto: Avaliação da noite" || echo "Sem mudanças"
          git push
