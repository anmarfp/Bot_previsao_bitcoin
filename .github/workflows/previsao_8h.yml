name: 8 da Manhã - Previsão
on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC = 08:00 BRT
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install google-genai requests
      - run: python robot_bitcoin.py manha
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salvar Histórico
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "bot@noreply.com"
          git add historico_bitcoin.json
          git commit -m "Auto: Previsão da manhã" || echo "Sem mudanças"
          git push
